<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherLens — Visual Discovery Engine</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: Outfits & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Sticky Branded Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <polygon points="12 6 12 12 15 15"></polygon>
          </svg>
        </div>
        <div class="brand-text">
          <h1>AetherLens</h1>
          <p class="tagline">Explore the extraordinary through high-resolution imagery</p>
        </div>
      </div>
      
      <div class="header-actions">
        <span class="status-badge">Part 1 Scaffold</span>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="main-content">
    <!-- Search Section -->
    <section class="search-section">
      <form id="searchForm" class="search-form" onsubmit="event.preventDefault();">
        <div class="input-wrapper">
          <label for="searchInput" class="sr-only">Search images by topic</label>
          <div class="search-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search high-res photos (e.g. Neon Cyberpunk, Deep Ocean)..." 
            autocomplete="off"
          />
          <button type="button" id="clearBtn" class="clear-btn" title="Clear input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <button type="submit" id="searchBtn" class="btn-search">
          <span>Search</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <!-- Category Quick-Pick Suggestion Chips -->
      <div class="quick-picks">
        <span class="quick-pick-label">Popular topics:</span>
        <div class="chips-container">
          <button type="button" class="chip">Architecture</button>
          <button type="button" class="chip">Deep Forest</button>
          <button type="button" class="chip">Cyberpunk</button>
          <button type="button" class="chip">Minimalism</button>
          <button type="button" class="chip">Astronomy</button>
        </div>
      </div>
    </section>

    <!-- Results Section -->
    <section class="results-section">
      <!-- Result Count / Status Bar Placeholder -->
      <div id="resultsMeta" class="results-meta">
        <span class="meta-count">Ready to search</span>
        <span class="meta-hint">Enter a query above to fetch visual assets</span>
      </div>

      <!-- Empty State View -->
      <div id="emptyState" class="empty-state">
        <div class="empty-icon-wrap">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </div>
        <h3>Search to see results</h3>
        <p>Type a keyword or select a topic above to explore stunning visuals.</p>
      </div>

      <!-- Empty Results Container (Target for Part 2 Grid) -->
      <div id="results" class="results-grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
